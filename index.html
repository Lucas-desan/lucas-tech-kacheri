    const BOOKING_API_URL = '/api/bookings';

    const bookingApiRequest = async (path = '', options = {}) => {
      let response;
      try {
        response = await fetch(`${BOOKING_API_URL}${path}`, {
          ...options,
          headers: {
            'Content-Type': 'application/json',
            ...options.headers
          }
        });
      } catch (error) {
        console.error('Unable to reach the booking API', error);
        throw new Error('Cannot reach the booking service. Open the deployed Netlify site and make sure its booking function is deployed.');
      }

      let result;
      try {
        result = await response.json();
      } catch {
        if (response.status === 404) {
          throw new Error('The booking API was not found. Deploy the site with its Netlify booking function.');
        }
        throw new Error('The booking service returned an invalid response.');
      }

      if (!response.ok) {
        throw new Error(result.error || 'The booking service could not complete the request.');
      }

      return result;
    };

      typeof booking.service?.category === 'string' &&

        return null;

          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
          className={className}
          aria-hidden="true"
        >
          {iconParts.map(([element, attributes], index) => React.createElement(element, { key: index, ...attributes }))}
        </svg>
      );
    };

          return;

        setStorageError('');

            method: 'POST',
            body: JSON.stringify({
              service: selectedService,
              date: selectedDate,
              time: selectedTime,
              meetingType,
              customer: { ...formData }
            })
          });

            throw new Error('The booking was not confirmed because the server returned incomplete booking details. Please try again or contact support.');

                    <div className="flex justify-between">
                      <span className="text-slate-400">Location:</span>
                      <span className="text-white">{selectedBookingModal.customer.location}</span>
                    </div>
                  </div>

                  {selectedBookingModal.customer.notes && (
                    <div className="p-3 bg-[#0B192C] rounded-2xl border border-slate-800">
                      <span className="text-[10px] text-slate-400 uppercase font-bold block mb-1">Notes / Requirements:</span>
                      <p className="text-slate-300 text-xs italic">{selectedBookingModal.customer.notes}</p>
                    </div>
                  )}
                </div>

                <div className="mt-6 flex justify-end">
                  <button
                    onClick={() => setSelectedBookingModal(null)}
                    className="px-5 py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold rounded-xl"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="border-t border-slate-800/80 bg-[#0B192C] py-6 text-center text-xs text-slate-500">
            <p>© {new Date().getFullYear()} Lucas Technologies Kacheri (LTK). Services for Local & Global Growth.</p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
